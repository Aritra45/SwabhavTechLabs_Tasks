<div *ngIf="showSuccessAlert" style="text-align: center; margin-top: 20px;">
  <img [src]="isErrorMessage(successMessage) ? errorGif : successGif" alt="alert-gif"
    style="height: 200px; width: 300px;">

  <div [ngClass]="{
        'alert alert-danger': isErrorMessage(successMessage),
        'alert alert-success': !isErrorMessage(successMessage)
      }" role="alert">
    {{ successMessage }}
  </div>
</div>
