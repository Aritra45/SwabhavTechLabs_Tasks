<div class="dashboard-cards">
    <mat-card class="card get-card" (click)="get()">
      <mat-card-title>All InBound Beneficiary</mat-card-title>
      <mat-card-content>
        <p>View the list of all inbound beneficiaries</p>
      </mat-card-content>
      <mat-card-actions>
        <button mat-button color="primary" >VIEW</button>
      </mat-card-actions>
    </mat-card>

    <mat-card class="card post-card" (click)="add()">
      <mat-card-title>Add InBound Beneficiary</mat-card-title>
      <mat-card-content>
        <p>add new inbound beneficiary</p>
      </mat-card-content>
      <mat-card-actions>
        <button mat-button color="primary">ADD</button>
      </mat-card-actions>
    </mat-card>
    </div>
