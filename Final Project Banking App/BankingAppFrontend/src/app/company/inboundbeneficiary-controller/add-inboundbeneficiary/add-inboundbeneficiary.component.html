<h2 mat-dialog-title>Admin List</h2>

<div mat-dialog-content *ngIf="getData && getData.length > 0; else noData">
    <table mat-table [dataSource]="getData" class="mat-elevation-z8 full-width-table">

        <!-- Index Column -->
        <ng-container matColumnDef="companyEmail">
            <th mat-header-cell *matHeaderCellDef>CompanyEmail</th>
            <td mat-cell *matCellDef="let element">{{ element.companyEmail }}</td>
        </ng-container>

        <!-- Username Column -->
        <ng-container matColumnDef="companyName">
            <th mat-header-cell *matHeaderCellDef>CompanyName</th>
            <td mat-cell *matCellDef="let element">{{ element.companyName }}</td>
        </ng-container>

        <ng-container matColumnDef="companyAccountNumber">
            <th mat-header-cell *matHeaderCellDef>CompanyAccountNumber</th>
            <td mat-cell *matCellDef="let element">{{ element.companyAccountNumber }}</td>
        </ng-container>

        <ng-container matColumnDef="iFSCNumber">
            <th mat-header-cell *matHeaderCellDef>IFSCNumber</th>
            <td mat-cell *matCellDef="let element">{{ element.ifscNumber }}</td>
        </ng-container>

        <!-- Action Column -->
        <ng-container matColumnDef="action">
            <th mat-header-cell *matHeaderCellDef>Action</th>
            <td mat-cell *matCellDef="let element">
                <button mat-raised-button color="warn" style="background-color: blue; color: white;"
                    (click)="AddInbound(element)">
                    <!-- <mat-icon>delete</mat-icon> -->
                    Add
                </button>
            </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>
</div>

<ng-template #noData>
    <p>No admins found.</p>
</ng-template>
