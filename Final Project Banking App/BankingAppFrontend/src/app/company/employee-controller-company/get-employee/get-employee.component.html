<div style="display: inline-flex;">
<h2 mat-dialog-title>Employee List</h2>
<mat-dialog-actions align="end" style="margin-left: 35%;">
  <button mat-button mat-dialog-close>Close</button>
</mat-dialog-actions>
</div>
<div mat-dialog-content *ngIf="getData && getData.length > 0; else noData">
  <table mat-table [dataSource]="dataSource" class="mat-elevation-z8 full-width-table">

    <!-- Index Column -->
    <ng-container matColumnDef="employeeEmail">
      <th mat-header-cell *matHeaderCellDef>EmployeeEmail</th>
      <td mat-cell *matCellDef="let data">{{ data.employeeEmail }}</td>
    </ng-container>

    <!-- Username Column -->
    <ng-container matColumnDef="employeeFullName">
      <th mat-header-cell *matHeaderCellDef>EmployeeFullName</th>
      <td mat-cell *matCellDef="let data">{{ data.employeeFullName }}</td>
    </ng-container>

    <!-- Email Column -->
    <ng-container matColumnDef="employeeSalaryAmount">
      <th mat-header-cell *matHeaderCellDef>EmployeeSalaryAmount</th>
      <td mat-cell *matCellDef="let data">{{ data.employeeSalaryAmount }}</td>
    </ng-container>

    


    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  </table>
  <mat-paginator [pageSize]="10" [pageSizeOptions]="[5, 10, 20]" showFirstLastButtons></mat-paginator>
</div>

<ng-template #noData>
  <p>No banks found.</p>
</ng-template>
