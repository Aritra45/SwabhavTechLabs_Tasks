<h2 mat-dialog-title>InBound Beneficiary List</h2>
<div mat-dialog-content *ngIf="getData && getData.length > 0; else noData">
  <table mat-table [dataSource]="getData" class="mat-elevation-z8 full-width-table">

    <!-- Index Column -->
    <ng-container matColumnDef="employeeEmail">
      <th mat-header-cell *matHeaderCellDef>EmployeeEmail</th>
      <td mat-cell *matCellDef="let data of getData">{{ data.employeeEmail }}</td>
    </ng-container>

    <!-- Username Column -->
    <ng-container matColumnDef="employeeFullName">
      <th mat-header-cell *matHeaderCellDef>EmployeeFullName</th>
      <td mat-cell *matCellDef="let data of getData">{{ data.employeeFullName }}</td>
    </ng-container>

    <!-- Email Column -->
    <ng-container matColumnDef="employeeSalaryAmount">
      <th mat-header-cell *matHeaderCellDef>EmployeeSalaryAmount</th>
      <td mat-cell *matCellDef="let data of getData">{{ data.employeeSalaryAmount }}</td>
    </ng-container>

    


    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  </table>
</div>

<ng-template #noData>
  <p>No banks found.</p>
</ng-template>
