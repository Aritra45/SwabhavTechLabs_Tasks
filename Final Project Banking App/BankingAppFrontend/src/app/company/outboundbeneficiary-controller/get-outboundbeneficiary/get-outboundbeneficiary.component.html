<h2 mat-dialog-title>InBound Beneficiary List</h2>
<div mat-dialog-content *ngIf="getData && getData.length > 0; else noData">
  <table mat-table [dataSource]="getData" class="mat-elevation-z8 full-width-table">

    <!-- Index Column -->
    <ng-container matColumnDef="beneficiaryCompanyEmail">
      <th mat-header-cell *matHeaderCellDef>BeneficiaryCompanyEmail</th>
      <td mat-cell *matCellDef="let data of getData">{{ data.beneficiaryCompanyEmail }}</td>
    </ng-container>

    <!-- Username Column -->
    <ng-container matColumnDef="beneficiaryCompanyName">
      <th mat-header-cell *matHeaderCellDef>BeneficiaryCompanyName</th>
      <td mat-cell *matCellDef="let data of getData">{{ data.beneficiaryCompanyName }}</td>
    </ng-container>

    <!-- Email Column -->
    <ng-container matColumnDef="bankAccountNumber">
      <th mat-header-cell *matHeaderCellDef>BankAccountNumber</th>
      <td mat-cell *matCellDef="let data of getData">{{ data.bankAccountNumber }}</td>
    </ng-container>

    <ng-container matColumnDef="iFSCNumber">
        <th mat-header-cell *matHeaderCellDef>IFSCNumber</th>
        <td mat-cell *matCellDef="let data of getData">{{ data.ifscNumber}}</td>
      </ng-container>

      <ng-container matColumnDef="beneficiaryType">
        <th mat-header-cell *matHeaderCellDef>BeneficiaryType</th>
        <td mat-cell *matCellDef="let data of getData">{{ data.beneficiaryType }}</td>
      </ng-container>


    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  </table>
</div>

<ng-template #noData>
  <p>No banks found.</p>
</ng-template>
