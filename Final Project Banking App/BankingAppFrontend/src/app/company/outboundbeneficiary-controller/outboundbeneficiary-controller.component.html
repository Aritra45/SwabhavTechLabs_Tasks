<div>
  <h2 style="color: white; text-align: center;">
    OUTBOUND BENEFICIARY CONTROLLER
  </h2>
</div>
<div class="dashboard-cards">
    <mat-card class="card get-card" (click)="get()">
      <mat-card-title>All OutBound Beneficiary</mat-card-title>
      <mat-card-content>
        <p>View the list of all outbound beneficiaries</p>
      </mat-card-content>
      <mat-card-actions>
        <button mat-button color="primary" >VIEW</button>
      </mat-card-actions>
    </mat-card>

    <mat-card class="card post-card" (click)="add()">
      <mat-card-title>Add OutBound Beneficiary</mat-card-title>
      <mat-card-content>
        <p>add new outbound beneficiary</p>
      </mat-card-content>
      <mat-card-actions>
        <button mat-button color="primary" >ADD</button>
      </mat-card-actions>
    </mat-card>
    </div>
