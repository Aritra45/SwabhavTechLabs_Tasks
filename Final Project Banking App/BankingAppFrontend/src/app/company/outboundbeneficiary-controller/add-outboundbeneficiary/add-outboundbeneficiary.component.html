<div *ngIf="formVisible">
    <form [formGroup]="adminForm" (ngSubmit)="onSubmit()" class="admin-form-container">
      <div class="form-header">
        <h2>Add OutBound Beneficiary</h2>
        <mat-dialog-actions align="end" style="margin-left: auto; margin-right: 0%;">
          <button mat-button mat-dialog-close>Close</button>
        </mat-dialog-actions>
      </div>
    
      <div class="form-group">
        <mat-form-field appearance="fill" class="full-width">
          <mat-label>Beneficiary Company Email</mat-label>
          <input matInput formControlName="beneficiaryCompanyEmail" placeholder="Enter email" required>
          <mat-error *ngIf="adminForm.get('beneficiaryCompanyEmail')?.invalid">Valid email required</mat-error>
        </mat-form-field>
      </div>
    
      <div class="form-group">
        <mat-form-field appearance="fill" class="full-width">
          <mat-label>Beneficiary Company Name</mat-label>
          <input matInput formControlName="beneficiaryCompanyName" placeholder="Enter Beneficiary Company Name" required>
          <mat-error *ngIf="adminForm.get('beneficiaryCompanyName')?.invalid">Beneficiary Company Name required</mat-error>
        </mat-form-field>
      </div>

      <div class="form-group">
        <mat-form-field appearance="fill" class="full-width">
          <mat-label>Bank Account Number</mat-label>
          <input matInput formControlName="bankAccountNumber" placeholder="Enter Bank Account Number" required>
          <mat-error *ngIf="adminForm.get('bankAccountNumber')?.invalid">Bank Account Number required</mat-error>
        </mat-form-field>
      </div>

      <div class="form-group">
        <mat-form-field appearance="fill" class="full-width">
          <mat-label>IFSC Number</mat-label>
          <input matInput formControlName="ifscNumber" placeholder="Enter IFSC Number" required>
          <mat-error *ngIf="adminForm.get('ifscNumber')?.invalid">IFSC Number required</mat-error>
        </mat-form-field>
      </div>
    
     
    
      <div class="form-action">
        <button mat-raised-button color="primary" type="submit" [disabled]="adminForm.invalid" [disabled]="isLoading" class="submit-btn">
          <span *ngIf="!isLoading">Add Beneficiary</span>
          <mat-spinner *ngIf="isLoading" diameter="20" [strokeWidth]="2"></mat-spinner>
        </button>
        
      </div>
    </form>
  </div>
