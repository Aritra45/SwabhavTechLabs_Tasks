<div style="display: inline-flex;">
    <h2 mat-dialog-title>Transaction List</h2>
    <mat-dialog-actions align="end" style="margin-left: auto; margin-right: 0%;">
      <button mat-button mat-dialog-close>Close</button>
    </mat-dialog-actions>
    </div>
    <div style="margin-bottom: 10px;">
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Search Transaction</mat-label>
        <input matInput (keyup)="applyFilter($event)" placeholder="Type to search...">
      </mat-form-field>
    </div>
    <div mat-dialog-content *ngIf="getData && getData.length > 0; else noData">
      <table mat-table [dataSource]="dataSource" class="mat-elevation-z8 full-width-table">
    
        <!-- Index Column -->
        <ng-container matColumnDef="transactionId">
          <th mat-header-cell *matHeaderCellDef>TransactionId</th>
          <td mat-cell *matCellDef="let data">{{ data.transactionId }}</td>
        </ng-container>
    
        <!-- Email Column -->
        <ng-container matColumnDef="transferToCompanyEmail">
          <th mat-header-cell *matHeaderCellDef>TransferToCompanyEmail</th>
          <td mat-cell *matCellDef="let data">{{ data.transferToCompanyEmail }}</td>
        </ng-container>
    
        <ng-container matColumnDef="paymentDate">
            <th mat-header-cell *matHeaderCellDef>paymentDate</th>
            <td mat-cell *matCellDef="let data of getData">{{ data.paymentDate | date: 'short' }}</td>
          </ng-container>
    
          <ng-container matColumnDef="status">
            <th mat-header-cell *matHeaderCellDef>Status</th>
            <td mat-cell *matCellDef="let data">{{ data.status }}</td>
          </ng-container>
    
    
        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
      </table>
      <mat-paginator [pageSize]="5" [pageSizeOptions]="[5, 10, 20]" showFirstLastButtons></mat-paginator>
    </div>
    
    <ng-template #noData>
      <p>No transactions found.</p>
    </ng-template>
