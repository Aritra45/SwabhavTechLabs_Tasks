<div *ngIf="formVisible">
    <form [formGroup]="adminForm" (ngSubmit)="onSubmit()" class="admin-form-container">
      <div class="form-header">
        <h2>Add Transaction</h2>
        <mat-dialog-actions align="end" style="margin-left: 25%;">
          <button mat-button mat-dialog-close>Close</button>
        </mat-dialog-actions>

      </div>
    
      <div class="form-group">
        <mat-form-field appearance="fill" class="full-width">
          <mat-label>Transfer To CompanyEmail</mat-label>
          <input matInput formControlName="transferToCompanyEmail" placeholder="Enter email" required>
          <mat-error *ngIf="adminForm.get('transferToCompanyEmail')?.invalid">Valid email required</mat-error>
        </mat-form-field>
      </div>
    
      <div class="form-group">
        <mat-form-field appearance="fill" class="full-width">
          <mat-label>TransactionAmount</mat-label>
          <input matInput formControlName="transactionAmount" placeholder="Enter Amount" required>
          <mat-error *ngIf="adminForm.get('transactionAmount')?.invalid">Amount required</mat-error>
        </mat-form-field>
      </div>
    
      
    
      <div class="form-action">
        <button mat-raised-button color="primary" type="submit" [disabled]="adminForm.invalid" class="submit-btn">
          Send Money
        </button>
      </div>
    </form>
  </div>
