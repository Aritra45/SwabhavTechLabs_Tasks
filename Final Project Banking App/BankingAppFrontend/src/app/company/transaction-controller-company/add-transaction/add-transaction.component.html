<div style="display: inline-flex;">
  <h2 mat-dialog-title>Beneficiary List</h2>
  <mat-dialog-actions align="end" style="margin-left: auto; margin-right: 0%;">
    <button mat-button mat-dialog-close>Close</button>
  </mat-dialog-actions>
</div>

<div style="margin-bottom: 10px;">
  <mat-form-field appearance="outline" class="full-width">
    <mat-label>Search Beneficiary</mat-label>
    <input matInput (keyup)="applyFilter($event)" placeholder="Type to search...">
  </mat-form-field>
</div>

<div mat-dialog-content *ngIf="dataSource && dataSource.data.length > 0; else noData">
  <table mat-table [dataSource]="dataSource" class="mat-elevation-z8 full-width-table">
    <!-- BeneficiaryCompanyEmail Column -->
    <ng-container matColumnDef="beneficiaryCompanyEmail">
      <th mat-header-cell *matHeaderCellDef>Beneficiary Company Email</th>
      <td mat-cell *matCellDef="let data">{{ data.beneficiaryCompanyEmail }}</td>
    </ng-container>

    <!-- BeneficiaryCompanyName Column -->
    <ng-container matColumnDef="beneficiaryCompanyName">
      <th mat-header-cell *matHeaderCellDef>Beneficiary Company Name</th>
      <td mat-cell *matCellDef="let data">{{ data.beneficiaryCompanyName }}</td>
    </ng-container>

    <!-- Action Column -->
    <ng-container matColumnDef="action">
      <th mat-header-cell *matHeaderCellDef>Action</th>
      <td mat-cell *matCellDef="let data">
        <button mat-raised-button color="warn" style="background-color: blue; color: white;" (click)="Select(data.beneficiaryCompanyEmail)">
          Select
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  </table>

  <mat-paginator [pageSize]="10" [pageSizeOptions]="[5, 10, 20]" showFirstLastButtons></mat-paginator>
</div>

<ng-template #noData>
  <p>No beneficiary found.</p>
</ng-template>
