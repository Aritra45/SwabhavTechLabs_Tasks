<h1 mat-dialog-title>Confirm Action</h1>
    <div mat-dialog-content>
      <p>Are you sure you want to proceed?</p>
    </div>
    <div mat-dialog-actions>
      <button style="border: solid 2px red;" mat-button mat-dialog-close>No</button>
      <button mat-button [mat-dialog-close]="true" style="border: solid 2px green;" cdkFocusInitial>Yes</button>
    </div>
