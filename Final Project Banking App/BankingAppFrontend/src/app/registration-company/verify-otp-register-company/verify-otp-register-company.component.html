<mat-card style="max-width: 600px; margin: 2rem auto;">
  <form [formGroup]="registerForm" (ngSubmit)="onSubmit()" enctype="multipart/form-data">
    <h2>Verify Company</h2>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Company Email</mat-label>
      <input matInput type="email" formControlName="companyEmail" required [disabled]="true"/>
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>OTP</mat-label>
      <input type="text" matInput formControlName="otp" placeholder="Enter 6 digit OTP" required />
      <mat-error *ngIf="registerForm.get('otp')?.hasError('minlength')">OTP must be 6 digits long</mat-error>
      <mat-error *ngIf="registerForm.get('otp')?.hasError('maxlength')">OTP must be 6 digits long</mat-error>
    </mat-form-field>

    <button mat-raised-button color="primary" type="submit">VERIFY</button>
    <br>
    <button mat-raised-button color="accent" (click)="resendOtp()" [disabled]="isResendDisabled" type="button">
      Resend OTP
      <span *ngIf="isResendDisabled">({{ timer }}s)</span>
    </button>
  </form>
</mat-card>
