<div mat-dialog-content>
    <table mat-table [dataSource]="getData" class="mat-elevation-z8 full-width-table">
  
      <!-- Select All Checkbox Column -->
      <ng-container matColumnDef="select">
        <th mat-header-cell *matHeaderCellDef>
          <mat-checkbox (change)="toggleAll($event)" [checked]="isAllSelected()" [indeterminate]="isIndeterminate()">
            Select All
          </mat-checkbox>
        </th>
        <td mat-cell *matCellDef="let row">
          <mat-checkbox [(ngModel)]="row.selected"></mat-checkbox>
        </td>
      </ng-container>
  
      <!-- Reasons Column -->
      <ng-container matColumnDef="reasons">
        <th mat-header-cell *matHeaderCellDef>Reasons</th>
        <td mat-cell *matCellDef="let row">
          <ul *ngFor="let reason of row.reasons">{{ reason }}
          </ul>
        </td>
      </ng-container>
  
      <!-- Define the rows and headers -->
      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>
  
    <button mat-raised-button color="primary" (click)="reject()" class="submit-btn" style="background-color: red; color: white;">
      Reject
    </button>
  </div>
