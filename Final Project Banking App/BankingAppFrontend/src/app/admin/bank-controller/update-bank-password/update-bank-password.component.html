<div style="display: inline-flex;">
  <h2 mat-dialog-title>Update bank Password</h2>
  
  <mat-dialog-actions align="end" style="margin-left: auto; margin-right: 0%;">
    <button mat-button mat-dialog-close>Close</button>
  </mat-dialog-actions>
  </div>
  
  
  <div mat-dialog-content *ngIf="getData && getData.length > 0; else noData">
    <table mat-table [dataSource]="dataSource" class="mat-elevation-z8 full-width-table">
  
      <!-- Index Column -->
      <ng-container matColumnDef="bankEmail">
        <th mat-header-cell *matHeaderCellDef style="text-align: center;">BankEmail</th>
        <td mat-cell *matCellDef="let element">{{ element.bankEmail }}</td>
      </ng-container>
  
      <!-- Username Column -->
      <ng-container matColumnDef="bankName">
          <th mat-header-cell *matHeaderCellDef style="text-align: center;">BankName</th>
          <td mat-cell *matCellDef="let element">{{ element.bankName }}</td>
        </ng-container>
  
     
      <!-- Action Column -->
      <ng-container matColumnDef="action1" >
        <th mat-header-cell *matHeaderCellDef style="text-align: center;">Action</th>
        <td mat-cell *matCellDef="let element" style="display: inline-flex; gap: 20px;">
          <button mat-raised-button color="warn" style="background-color: orange; color: white;" (click)="updatePassword(element.bankEmail)">
              Update
            </button>
            
        </td>
      </ng-container>
  
      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>
    <mat-paginator [pageSize]="10" [pageSizeOptions]="[5, 10, 20]" showFirstLastButtons></mat-paginator>
  </div>
  
  <ng-template #noData>
    <p>No companies found.</p>
  </ng-template>
