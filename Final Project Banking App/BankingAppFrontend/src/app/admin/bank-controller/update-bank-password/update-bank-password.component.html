<h2 mat-dialog-title>Update Bank Password</h2>

<mat-form-field appearance="fill">
  <mat-label>Enter Bank Email</mat-label>
  <input matInput [(ngModel)]="bankEmail" />
</mat-form-field>

<mat-form-field appearance="fill">
  <mat-label>Current Password</mat-label>
  <input matInput [(ngModel)]="currentPassword" type="password" />
</mat-form-field>

<mat-form-field appearance="fill">
  <mat-label>New Password</mat-label>
  <input matInput [(ngModel)]="newPassword" type="password" />
</mat-form-field>

<mat-form-field appearance="fill">
  <mat-label>Confirm Password</mat-label>
  <input matInput [(ngModel)]="confirmPassword" type="password" />
</mat-form-field>

<button mat-raised-button color="primary" (click)="updatePassword()">Update Password</button>


<div *ngIf="bankData">
    <h2 mat-dialog-title>Bank Details</h2>
    <div mat-dialog-content>
      <table mat-table [dataSource]="[bankData]" class="mat-elevation-z8 full-width-table">
  
        <!-- Index Column -->
        <ng-container matColumnDef="index">
          <th mat-header-cell *matHeaderCellDef>No.</th>
          <td mat-cell *matCellDef="let element; let i = index">{{ i + 1 }}</td>
        </ng-container>
  
        <!-- Bank Name Column -->
        <ng-container matColumnDef="bankName">
          <th mat-header-cell *matHeaderCellDef>Bank Name</th>
          <td mat-cell *matCellDef="let element">{{ element.bankName }}</td>
        </ng-container>
  
        <!-- Branch Code Column -->
        <ng-container matColumnDef="branchCode">
          <th mat-header-cell *matHeaderCellDef>Branch Code</th>
          <td mat-cell *matCellDef="let element">{{ element.branchCode }}</td>
        </ng-container>
  
        <!-- Bank Address Column -->
        <ng-container matColumnDef="bankAddress">
          <th mat-header-cell *matHeaderCellDef>Bank Address</th>
          <td mat-cell *matCellDef="let element">{{ element.bankAddress }}</td>
        </ng-container>
  
        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
      </table>
    </div>
  </div>
