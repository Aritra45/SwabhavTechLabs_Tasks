<div>
    <form [formGroup]="adminForm" (ngSubmit)="onSubmit()" class="admin-form-container">
      <div class="form-header">
        <h2>Change Password</h2>
        <mat-dialog-actions align="end" style="margin-left: auto; margin-right: 0%;">
          <button mat-button mat-dialog-close>Close</button>
        </mat-dialog-actions>
      </div>
    
      <div class="form-group">
        <mat-form-field appearance="fill" class="full-width">
          <mat-label>Current Password</mat-label>
          <input matInput [type]="hidePassword1 ? 'password' : 'text'" formControlName="currentPassword" placeholder="Enter current password" required>
          <button mat-icon-button 
                matSuffix 
                (click)="togglePasswordVisibility1()" 
                [attr.aria-label]="'Hide password'" 
                [attr.aria-pressed]="!hidePassword1"
                type="button">
          <mat-icon>{{ hidePassword1 ? 'visibility_off' : 'visibility' }}</mat-icon>
        </button>
          <mat-error *ngIf="adminForm.get('currentPassword')?.invalid">Valid email required</mat-error>
        </mat-form-field>
      </div>
    
      <div class="form-group">
        <mat-form-field appearance="fill" class="full-width">
          <mat-label>New Password</mat-label>
          <input matInput [type]="hidePassword2 ? 'password' : 'text'" formControlName="newPassword" placeholder="Enter New Password" required>
          <button mat-icon-button 
                matSuffix 
                (click)="togglePasswordVisibility2()" 
                [attr.aria-label]="'Hide password'" 
                [attr.aria-pressed]="!hidePassword2"
                type="button">
          <mat-icon>{{ hidePassword2 ? 'visibility_off' : 'visibility' }}</mat-icon>
        </button>
        <mat-error *ngIf="adminForm.get('newPassword')?.hasError('required')">Password is required</mat-error>
        <mat-error *ngIf="adminForm.get('newPassword')?.hasError('minlength')">Password must be at least 6 characters long</mat-error>
        <mat-error *ngIf="adminForm.get('newPassword')?.hasError('pattern')">Password must contain at least one uppercase letter, one lowercase letter, one digit, and one special character</mat-error>
        </mat-form-field>
      </div>
    
      <div class="form-group">
        <mat-form-field appearance="fill" class="full-width">
          <mat-label>Confirm Password</mat-label>
          <input matInput [type]="hidePassword3 ? 'password' : 'text'" formControlName="confirmPassword" placeholder="Enter confirm password" required>
          <button mat-icon-button 
                matSuffix 
                (click)="togglePasswordVisibility3()" 
                [attr.aria-label]="'Hide password'" 
                [attr.aria-pressed]="!hidePassword3"
                type="button">
          <mat-icon>{{ hidePassword3 ? 'visibility_off' : 'visibility' }}</mat-icon>
        </button>
        
        </mat-form-field>
      </div>
    
      <div class="form-action">
        <button mat-raised-button color="primary" type="submit" [disabled]="adminForm.invalid" [disabled]="isLoading" class="submit-btn">
          <span *ngIf="!isLoading">Update</span>
          <mat-spinner *ngIf="isLoading" diameter="20" [strokeWidth]="2"></mat-spinner>
        </button>
        
      </div>
    </form>
  </div>
