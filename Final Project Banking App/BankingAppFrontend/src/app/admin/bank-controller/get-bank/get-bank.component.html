<h2 mat-dialog-title>Bank List</h2>

<!-- Search Box -->
<div style="margin-bottom: 10px;">
  <mat-form-field appearance="outline" class="full-width">
    <mat-label>Search Bank</mat-label>
    <input matInput (keyup)="applyFilter($event)" placeholder="Type to search...">
  </mat-form-field>
</div>
<div mat-dialog-content *ngIf="getData && getData.length > 0; else noData">
  <table mat-table [dataSource]="dataSource" class="mat-elevation-z8 full-width-table">

    <!-- Index Column -->
    <ng-container matColumnDef="index">
      <th mat-header-cell *matHeaderCellDef>No.</th>
      <td mat-cell *matCellDef="let data ; let i = index">{{ i + 1 }}</td>
    </ng-container>

    <!-- Username Column -->
    <ng-container matColumnDef="bankName">
      <th mat-header-cell *matHeaderCellDef>BankName</th>
      <td mat-cell *matCellDef="let data ">{{ data.bankName }}</td>
    </ng-container>

    <!-- Email Column -->
    <ng-container matColumnDef="branchCode">
      <th mat-header-cell *matHeaderCellDef>BranchCode</th>
      <td mat-cell *matCellDef="let data ">{{ data.branchCode }}</td>
    </ng-container>

    <ng-container matColumnDef="bankAddress">
        <th mat-header-cell *matHeaderCellDef>BankAddress</th>
        <td mat-cell *matCellDef="let data ">{{ data.bankAddress }}</td>
      </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  </table>
  <mat-paginator [pageSize]="10" [pageSizeOptions]="[5, 10, 20]" showFirstLastButtons></mat-paginator>
</div>

<ng-template #noData>
  <p>No Banks found.</p>
</ng-template>
