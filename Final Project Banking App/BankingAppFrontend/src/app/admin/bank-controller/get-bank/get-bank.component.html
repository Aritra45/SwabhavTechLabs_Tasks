<h2 mat-dialog-title>Bank List</h2>
<div mat-dialog-content *ngIf="getData && getData.length > 0; else noData">
  <table mat-table [dataSource]="getData" class="mat-elevation-z8 full-width-table">

    <!-- Index Column -->
    <ng-container matColumnDef="index">
      <th mat-header-cell *matHeaderCellDef>No.</th>
      <td mat-cell *matCellDef="let data of getData; let i = index">{{ i + 1 }}</td>
    </ng-container>

    <!-- Username Column -->
    <ng-container matColumnDef="bankName">
      <th mat-header-cell *matHeaderCellDef>BankName</th>
      <td mat-cell *matCellDef="let data of getData">{{ data.bankName }}</td>
    </ng-container>

    <!-- Email Column -->
    <ng-container matColumnDef="branchCode">
      <th mat-header-cell *matHeaderCellDef>BranchCode</th>
      <td mat-cell *matCellDef="let data of getData">{{ data.branchCode }}</td>
    </ng-container>

    <ng-container matColumnDef="bankAddress">
        <th mat-header-cell *matHeaderCellDef>BankAddress</th>
        <td mat-cell *matCellDef="let data of getData">{{ data.bankAddress }}</td>
      </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  </table>
</div>

<ng-template #noData>
  <p>No admins found.</p>
</ng-template>
