<div style="display: inline-flex;">
<h2 mat-dialog-title>Admin List</h2>
<mat-dialog-actions align="end" style="margin-left: auto; margin-right: 0%;">
  <button mat-button mat-dialog-close>Close</button>
</mat-dialog-actions>
</div>
<div mat-dialog-content *ngIf="getData && getData.length > 0; else noData">
  <table mat-table [dataSource]="getData" class="mat-elevation-z8 full-width-table">

    <!-- Index Column -->
    <ng-container matColumnDef="index">
      <th mat-header-cell *matHeaderCellDef>No.</th>
      <td mat-cell *matCellDef="let element; let i = index">{{ i + 1 }}</td>
    </ng-container>

    <!-- Username Column -->
    <ng-container matColumnDef="bankName">
      <th mat-header-cell *matHeaderCellDef>BankName/th>
      <td mat-cell *matCellDef="let element">{{ element.bankName }}</td>
    </ng-container>

    <!-- Email Column -->
    <ng-container matColumnDef="bankEmail">
      <th mat-header-cell *matHeaderCellDef>Email</th>
      <td mat-cell *matCellDef="let element">{{ element.bankEmail }}</td>
    </ng-container>

    <!-- Action Column -->
    <ng-container matColumnDef="action">
      <th mat-header-cell *matHeaderCellDef>Action</th>
      <td mat-cell *matCellDef="let element">
        <button mat-raised-button color="warn" style="background-color: red; color: white;" (click)="deleteBank(element.bankEmail, element.bankName)">
            <mat-icon>delete</mat-icon>
            Delete
          </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  </table>
</div>

<ng-template #noData>
  <p>No admins found.</p>
</ng-template>
