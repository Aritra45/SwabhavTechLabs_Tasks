<h2 mat-dialog-title>Search Audit by Date</h2>

<mat-form-field appearance="fill">
  <mat-label>Select Date</mat-label>
  <input
    matInput
    [matDatepicker]="picker"
    (dateChange)="fetchAuditsByDate($event.value)"
    placeholder="Choose a date" />
  <mat-datepicker-toggle matSuffix [for]="picker"></mat-datepicker-toggle>
  <mat-datepicker #picker></mat-datepicker>
</mat-form-field>

<ng-container *ngIf="auditData">
  <h2 mat-dialog-title>Audit Logs</h2>
  <div mat-dialog-content *ngIf="auditData.length > 0; else noData">
    <table mat-table [dataSource]="auditData" class="mat-elevation-z8 full-width-table">

      <ng-container matColumnDef="auditId">
        <th mat-header-cell *matHeaderCellDef>AuditId</th>
        <td mat-cell *matCellDef="let data">{{ data.auditId }}</td>
      </ng-container>

      <ng-container matColumnDef="userId">
        <th mat-header-cell *matHeaderCellDef>UserId</th>
        <td mat-cell *matCellDef="let data">{{ data.userId }}</td>
      </ng-container>

      <ng-container matColumnDef="description">
        <th mat-header-cell *matHeaderCellDef>Description</th>
        <td mat-cell *matCellDef="let data">{{ data.description }}</td>
      </ng-container>

      <ng-container matColumnDef="time">
        <th mat-header-cell *matHeaderCellDef>Time</th>
        <td mat-cell *matCellDef="let data">{{ data.time | date: 'short' }}</td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>
  </div>
  <ng-template #noData>
    <p>No audits found for {{ selectedDate | date:'fullDate' }}.</p>
  </ng-template>
</ng-container>
