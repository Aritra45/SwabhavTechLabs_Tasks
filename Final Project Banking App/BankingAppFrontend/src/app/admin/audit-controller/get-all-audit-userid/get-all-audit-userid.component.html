<h2 mat-dialog-title>Search Audit by User ID</h2>

<mat-form-field appearance="fill">
  <mat-label>Enter User ID</mat-label>
  <input matInput #userIdInput type="text" />
</mat-form-field>

<button mat-raised-button color="primary" (click)="fetchAuditsByUserId(userIdInput.value)">
  Search Audits
</button>


<div *ngIf="auditData">
    <h2 mat-dialog-title>Audit Logs</h2>
    <div mat-dialog-content *ngIf="auditData.length > 0; else noData">
      <table mat-table [dataSource]="auditData" class="mat-elevation-z8 full-width-table">
        
        <!-- AuditId Column -->
        <ng-container matColumnDef="auditId">
          <th mat-header-cell *matHeaderCellDef>AuditId</th>
          <td mat-cell *matCellDef="let data">{{ data.auditId }}</td>
        </ng-container>
  
        <!-- UserId Column -->
        <ng-container matColumnDef="userId">
          <th mat-header-cell *matHeaderCellDef>UserId</th>
          <td mat-cell *matCellDef="let data">{{ data.userId }}</td>
        </ng-container>
  
        <!-- Description Column -->
        <ng-container matColumnDef="description">
          <th mat-header-cell *matHeaderCellDef>Description</th>
          <td mat-cell *matCellDef="let data">{{ data.description }}</td>
        </ng-container>
  
        <!-- Time Column -->
        <ng-container matColumnDef="time">
          <th mat-header-cell *matHeaderCellDef>Time</th>
          <td mat-cell *matCellDef="let data">{{ data.time }}</td>
        </ng-container>
  
        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
      </table>
    </div>
  
    <ng-template #noData>
      <p>No audits found.</p>
    </ng-template>
  </div>
