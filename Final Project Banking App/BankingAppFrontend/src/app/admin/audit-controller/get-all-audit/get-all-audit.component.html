<h2 mat-dialog-title>Audit Logs</h2>
<div mat-dialog-content *ngIf="getData && getData.length > 0; else noData">
  <table mat-table [dataSource]="getData" class="mat-elevation-z8 full-width-table">

    <!-- Index Column -->
    <ng-container matColumnDef="auditId">
      <th mat-header-cell *matHeaderCellDef>AuditId</th>
      <td mat-cell *matCellDef="let data of getData">{{ data.auditId }}</td>
    </ng-container>

    <!-- Username Column -->
    <ng-container matColumnDef="userId">
      <th mat-header-cell *matHeaderCellDef>UserId</th>
      <td mat-cell *matCellDef="let data of getData">{{ data.userId }}</td>
    </ng-container>

    <!-- Email Column -->
    <ng-container matColumnDef="description">
      <th mat-header-cell *matHeaderCellDef>Description</th>
      <td mat-cell *matCellDef="let data of getData">{{ data.description }}</td>
    </ng-container>

    <ng-container matColumnDef="time">
        <th mat-header-cell *matHeaderCellDef>Time</th>
        <td mat-cell *matCellDef="let data of getData">{{ data.time }}</td>
      </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  </table>
</div>

<ng-template #noData>
  <p>No admins found.</p>
</ng-template>
