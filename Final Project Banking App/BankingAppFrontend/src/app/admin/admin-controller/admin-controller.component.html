<div class="dashboard-cards">
    <mat-card class="card get-card" >
      <mat-card-title>All Admins</mat-card-title>
      <mat-card-content>
        <p>View the list of all admins</p>
      </mat-card-content>
      <mat-card-actions>
        <button mat-button color="primary" (click)="get()">VIEW</button>
      </mat-card-actions>
    </mat-card>
  
    <mat-card class="card post-card" >
      <mat-card-title>Add Admin</mat-card-title>
      <mat-card-content>
        <p>Create a new admin</p>
      </mat-card-content>
      <mat-card-actions>
        <button mat-button color="accent" (click)="openAddAdminDialog()">ADD</button>
      </mat-card-actions>
    </mat-card>
  
    <mat-card class="card delete-card">
      <mat-card-title>Remove Admin</mat-card-title>
      <mat-card-content>
        <p>Delete admin access using email</p>
      </mat-card-content>
      <mat-card-actions>
        <button mat-button color="warn" (click)="remove()">REMOVE</button>
      </mat-card-actions>
    </mat-card>
  </div>
