<div class="dashboard-cards">
    <mat-card class="card get-card" (click)="get()">
      <mat-card-title>All Admins</mat-card-title>
      <mat-card-content>
        <p>View the list of all admins</p>
      </mat-card-content>
      <mat-card-actions>
        <button mat-button color="primary">VIEW</button>
      </mat-card-actions>
    </mat-card>
  
    <mat-card class="card post-card" >
      <mat-card-title>Add Admin</mat-card-title>
      <mat-card-content>
        <p>Create a new admin</p>
      </mat-card-content>
      <mat-card-actions>
        <button mat-button color="accent" >ADD</button>
      </mat-card-actions>
    </mat-card>
  
    <mat-card class="card delete-card" (click)="remove()">
      <mat-card-title>Remove Admin</mat-card-title>
      <mat-card-content>
        <p>Delete admin access using email</p>
      </mat-card-content>
      <mat-card-actions>
        <button mat-button color="warn">REMOVE</button>
      </mat-card-actions>
    </mat-card>
  </div>
