<div style="display: inline-flex;">
<h2 mat-dialog-title>Pending Salary List</h2>
<mat-dialog-actions align="end" style="margin-left: 55%;">
  <button mat-button mat-dialog-close>Close</button>
</mat-dialog-actions>
</div>
<!-- Search Box -->
<div style="margin-bottom: 10px;">
  <mat-form-field appearance="outline" class="full-width">
    <mat-label>Search Pending Salary</mat-label>
    <input matInput (keyup)="applyFilter($event)" placeholder="Type to search...">
  </mat-form-field>
</div>

<div mat-dialog-content *ngIf="getData && getData.length > 0; else noData">
  <table mat-table [dataSource]="dataSource" class="mat-elevation-z8 full-width-table">

    <!-- Index Column -->
    <ng-container matColumnDef="transactionId">
      <th mat-header-cell *matHeaderCellDef style="text-align: center;">TransactionId</th>
      <td mat-cell *matCellDef="let element">{{ element.transactionId }}</td>
    </ng-container>

    <!-- Username Column -->
    <ng-container matColumnDef="employeeEmail">
        <th mat-header-cell *matHeaderCellDef style="text-align: center;">EmployeeEmail</th>
        <td mat-cell *matCellDef="let element">{{ element.employeeEmail }}</td>
      </ng-container>

    <ng-container matColumnDef="amount">
      <th mat-header-cell *matHeaderCellDef style="text-align: center;">Amount</th>
      <td mat-cell *matCellDef="let element">{{ element.amount }}</td>
    </ng-container>

    <!-- Email Column -->
    
    
      <ng-container matColumnDef="transactionDate">
        <th mat-header-cell *matHeaderCellDef style="text-align: center;">transactionDate</th>
        <td mat-cell *matCellDef="let element">{{ element.transactionDate | date: 'short' }}</td>
      </ng-container>
      
      <ng-container matColumnDef="status">
        <th mat-header-cell *matHeaderCellDef style="text-align: center;">Status</th>
        <td mat-cell *matCellDef="let element">{{ element.status }}</td>
      </ng-container>

    <!-- Action Column -->
    <ng-container matColumnDef="action1" >
      <th mat-header-cell *matHeaderCellDef style="text-align: center;">Action</th>
      <td mat-cell *matCellDef="let element" style="display: inline-flex; gap: 20px;">
        <button mat-raised-button color="warn" style="background-color: red; color: white;" (click)="rejectTransaction(element.transactionId)">
            Reject
          </button>
          <button mat-raised-button color="warn" style="background-color: blue; color: white;" (click)="approveTransaction(element.transactionId)">
            Approved
          </button>
      </td>

        

    </ng-container>

    

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  </table>
  <mat-paginator [pageSize]="10" [pageSizeOptions]="[5, 10, 20]" showFirstLastButtons></mat-paginator>
</div>

<ng-template #noData>
  <p>No Salaries found.</p>
</ng-template>
