<div>
  <h2 style="color: white; text-align: center;">
    OUTBOUND BENEFICIARY CONTROLLER
  </h2>
</div>
<div class="dashboard-cards">
  <mat-card class="card get-card" (click)="get()">
    <mat-card-title>View Updated Company Beneficiary</mat-card-title>
    <mat-card-content>
      <p>View Updated outbound beneficiaries</p>
    </mat-card-content>
    <mat-card-actions>
      <button mat-button color="warn">VIEW</button>
    </mat-card-actions>
  </mat-card>

  <mat-card class="card update-card" (click)="update()">
    <mat-card-title>Update Pendeing Company Beneficiary</mat-card-title>
    <mat-card-content>
      <p>Change status of outbound beneficiaries</p>
    </mat-card-content>
    <mat-card-actions>
      <button mat-button color="warn">UPDATE</button>
    </mat-card-actions>
  </mat-card>

</div>
