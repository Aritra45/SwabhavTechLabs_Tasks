<h2 mat-dialog-title>Pending Companies List</h2>

<!-- Search Box -->
<div style="margin-bottom: 10px;">
  <mat-form-field appearance="outline" class="full-width">
    <mat-label>Search Outbound Beneficiary</mat-label>
    <input matInput (keyup)="applyFilter($event)" placeholder="Type to search...">
  </mat-form-field>
</div>

<div mat-dialog-content *ngIf="getData && getData.length > 0; else noData">
  <table mat-table [dataSource]="dataSource" class="mat-elevation-z8 full-width-table">

    <!-- Index Column -->
    <ng-container matColumnDef="beneficiaryCompanyEmail">
      <th mat-header-cell *matHeaderCellDef style="text-align: center;">BeneficiaryCompanyEmail</th>
      <td mat-cell *matCellDef="let element">{{ element.beneficiaryCompanyEmail }}</td>
    </ng-container>

    <!-- Username Column -->
    <ng-container matColumnDef="beneficiaryCompanyName">
        <th mat-header-cell *matHeaderCellDef style="text-align: center;">BeneficiaryCompanyName</th>
        <td mat-cell *matCellDef="let element">{{ element.beneficiaryCompanyName }}</td>
      </ng-container>

    
    
    <!-- Action Column -->
    <ng-container matColumnDef="action1" >
      <th mat-header-cell *matHeaderCellDef style="text-align: center;">Action</th>
      <td mat-cell *matCellDef="let element" style="display: inline-flex; gap: 20px;">
        <button mat-raised-button color="warn" style="background-color: red; color: white;" (click)="rejectBeneficiary(element.beneficiaryCompanyEmail, element.beneficiaryCompanyName)">
            Reject
          </button>
          <button mat-raised-button color="warn" style="background-color: red; color: white;" (click)="approveBeneficiary(element.beneficiaryCompanyEmail, element.beneficiaryCompanyName)">
            Approved
          </button>
      </td>

        

    </ng-container>

    

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  </table>
  <mat-paginator [pageSize]="10" [pageSizeOptions]="[5, 10, 20]" showFirstLastButtons></mat-paginator>
</div>

<ng-template #noData>
  <p>No beneficiaries found.</p>
</ng-template>
