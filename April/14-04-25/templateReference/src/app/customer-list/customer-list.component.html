<h1>Customer List</h1>
<div>
<table>
    <tbody>
    <tr>
      <th>Customer No</th>
      <th>Customer Name</th>
      <th>City</th>
      <th>Country</th>
      <th>Address</th>
      <th>Action</th>
    </tr>

    <tr *ngFor="let customer of customers, index as i">
      <td>{{ customer.customerNo }}</td>
      <td>{{ customer.name }}</td>
      <td>{{customer.city}}</td>
      <td>{{customer.country}}</td>
      <td>{{customer.address}}</td>
      <td><button (click)="getData(i)">Select</button></td>
    </tr>
</tbody>
</table>
</div>
